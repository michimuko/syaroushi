<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>通知設定</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>業務進捗・期限管理 通知設定</h1>
      <p class="hint">
        Webアプリの「設定 &gt; デスクトップ通知アプリ」で発行したURL・アクセストークンを入力してください。
      </p>

      <form id="settings-form">
        <label for="base-url">事務所のURL</label>
        <input id="base-url" type="text" placeholder="https://example.com" autocomplete="off" required />

        <label for="token">アクセストークン</label>
        <input id="token" type="password" placeholder="発行したトークンを貼り付け" autocomplete="off" required />

        <label for="interval">確認間隔（分）</label>
        <input id="interval" type="number" min="1" max="180" value="5" required />

        <div class="row">
          <label class="checkbox">
            <input id="autostart" type="checkbox" />
            パソコンの電源を入れたら自動でこのアプリを起動する（推奨）
          </label>
        </div>
        <p class="hint checkbox-hint">
          オンにすると、パソコンを起動するたびに自動でこのアプリが立ち上がり、通知を受け取れる状態になります。オフにすると、通知を受け取りたいときに毎回自分で起動する必要があります。
        </p>

        <div class="row buttons">
          <button type="submit">保存</button>
          <button type="button" id="poll-now-btn">今すぐ通知を取得する</button>
        </div>
      </form>

      <div id="status" class="status"></div>
    </main>
  </body>
</html>
