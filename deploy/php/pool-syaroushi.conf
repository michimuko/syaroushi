; さくらのVPS 1GBプラン（メモリ1GB）向けPHP-FPMプール設定
; 配置先: /etc/php/8.3/fpm/pool.d/syaroushi.conf
;（デフォルトの www.conf は無効化するか、[www] セクションと重複しないようにする）
;
; MySQL・cron起動のキューワーカー・Nginxと1GBを分け合う前提のため、
; pm.max_children をかなり絞る。PDFレポート生成（dompdf）が1リクエストで
; memory_limitに近いメモリを使うことがあるため、memory_limit自体は下げない。
; 1ワーカーあたりの実測メモリ使用量が想定より大きい場合は max_children をさらに下げること
; （目安: `ps --sort=-rss -eo rss,comm | grep php-fpm` で確認）。
;
; 2GBプランへスケールアップした場合は pool-syaroushi-2gb.conf に差し替える。

[syaroushi]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm-syaroushi.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 3
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500

php_admin_value[memory_limit] = 128M
