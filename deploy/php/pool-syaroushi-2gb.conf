; さくらのVPS 2GBプラン（メモリ2GB・vCPU3）向けPHP-FPMプール設定
; 配置先: /etc/php/8.3/fpm/pool.d/syaroushi.conf
;（デフォルトの www.conf は無効化するか、[www] セクションと重複しないようにする）
;
; MySQL・キューワーカー・Nginxと同居する前提でメモリを使い切らないよう、
; pm.max_children を控えめに設定する。1ワーカーあたりの実測メモリ使用量が
; 想定より大きい場合は max_children をさらに下げること
; （目安: `ps --sort=-rss -eo rss,comm | grep php-fpm` で確認）。

[syaroushi]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm-syaroushi.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

php_admin_value[memory_limit] = 128M
