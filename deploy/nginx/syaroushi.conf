# さくらのVPS本番用 Nginx サイト設定テンプレート
# 配置先: /etc/nginx/sites-available/syaroushi.conf
# 有効化: ln -s /etc/nginx/sites-available/syaroushi.conf /etc/nginx/sites-enabled/
#
# server_name・証明書パスは実際のドメインに合わせて書き換えること。
# TLS証明書は certbot（Let's Encrypt）で取得する想定
# （例: certbot --nginx -d korotane.site）。

server {
    listen 80;
    listen [::]:80;
    server_name korotane.site;

    # certbot --nginx実行後、ここは自動的にHTTPSへのリダイレクトに書き換えられる
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name korotane.site;

    ssl_certificate     /etc/letsencrypt/live/korotane.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/korotane.site/privkey.pem;

    root /var/www/syaroushi/public;
    index index.php;

    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/syaroushi-access.log;
    error_log  /var/log/nginx/syaroushi-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-syaroushi.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
