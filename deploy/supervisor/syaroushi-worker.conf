; キューワーカー常駐設定（2GBプラン以降向け）
; 配置先: /etc/supervisor/conf.d/syaroushi-worker.conf
; 反映: supervisorctl reread && supervisorctl update && supervisorctl start syaroushi-worker:*
;
; 1GBプランでは常駐プロセスの分のメモリ（~80MB）を確保できないため使わない。
; 代わりにcronで `queue:work --stop-when-empty` を毎分起動する方式にしている
; （deploy/README.md参照）。2GBプランへスケールアップしたら、cronの当該行を削除し
; この設定を有効化することで即時処理に切り替えられる。
;
; numprocs=1: 2GBメモリの制約上、ワーカーは1プロセスに絞る。
; 通知バッチ（procedures:send-reminders等）はキュー投入量が多くないため、
; 詰まりが常態化するようならここを増やす前に処理内容の見直しを検討する。

[program:syaroushi-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/syaroushi/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/syaroushi
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/syaroushi/storage/logs/worker.log
stopwaitsecs=3600
